    <link

    />

    <!-- ── Inline Preloader CSS: ZERO black flash, paints frame 0 ── -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #FFFFFF !important;
        color: #0B2D5B;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
      }

      #vaya-initial-preloader {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100svh;
        z-index: 9999999;
        background: #FFFFFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        opacity: 1;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s ease;
      }

      #vaya-initial-preloader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .pre-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .pre-svg {
        width: 76px;
        height: 86px;
        overflow: visible;
      }

      /* Logo stroke & fill animations */
      .pre-v {
        stroke-dasharray: 84;
        stroke-dashoffset: 84;
        animation: drawV 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      }

      .pre-tri {
        stroke-dasharray: 98;
        stroke-dashoffset: 98;
        animation: drawTri 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
      }

      .pre-sand {
        opacity: 0;
        animation: fillSand 0.5s ease-out 0.75s forwards;
      }

      .pre-dash {
        stroke-dasharray: 46;
        stroke-dashoffset: 46;
        animation: drawPath 0.55s ease-in-out 0.95s forwards;
      }

      .pre-plane-wrap {
        opacity: 0;
        animation: flyPlane 0.75s cubic-bezier(0.25, 1, 0.5, 1) 1.25s forwards;
        transform-origin: 32px 38px;
      }

      .pre-wordmark {
        font-family: 'Outfit', sans-serif;
        font-size: 1.85rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: #0B2D5B;
        margin-top: 1.15rem;
        opacity: 0;
        transform: translateY(10px);
        animation: fadeInUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) 1.55s forwards;
      }

      .pre-tagline {
        font-family: 'Outfit', sans-serif;
        font-size: 0.92rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: #27B2C9;
        margin-top: 0.3rem;
        opacity: 0;
        transform: translateY(8px);
        animation: fadeInUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
      }

      @keyframes drawV {
        to { stroke-dashoffset: 0; }
      }
      @keyframes drawTri {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fillSand {
        to { opacity: 1; }
      }
      @keyframes drawPath {
        to { stroke-dashoffset: 0; }
      }
      @keyframes flyPlane {
        0% {
          opacity: 0;
          transform: translate(54px, 10px) scale(0.65) rotate(-130deg);
        }
        30% {
          opacity: 1;
        }
        100% {
          opacity: 1;
          transform: translate(32px, 38px) scale(0.9) rotate(-145deg);
        }
      }
      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Reduced motion fallback: 600ms static logo */
      @media (prefers-reduced-motion: reduce) {
        .pre-v, .pre-tri { stroke-dashoffset: 0 !important; animation: none !important; }
        .pre-sand { opacity: 1 !important; animation: none !important; }
        .pre-dash { stroke-dashoffset: 0 !important; animation: none !important; }
        .pre-plane-wrap { opacity: 1 !important; transform: translate(32px, 38px) scale(0.9) rotate(-145deg) !important; animation: none !important; }
        .pre-wordmark, .pre-tagline { opacity: 1 !important; transform: none !important; animation: none !important; }
      }

      /* Root container stays hidden until preloader ends */
      #root {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      #root.app-revealed {
        visibility: visible !important;
        opacity: 1 !important;
      }
    </style>

    <link rel="modulepreload" crossorigin href="/assets/gsap-SFc2wnMY.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CrnDS-Na.css">
  </head>
  <body>
    <!-- ── Inline Frame 0 Preloader (White background, zero black flash) ── -->
    <div id="vaya-initial-preloader" role="status" aria-label="Loading VAYA" aria-live="polite">
      <div class="pre-inner">
        <svg class="pre-svg" viewBox="0 0 64 72" aria-hidden="true">
          <defs>
            <linearGradient id="preGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#0B2D5B" />
              <stop offset="100%" stopColor="#27B2C9" />
            </linearGradient>
            <linearGradient id="preSandGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#F6A81C" />
              <stop offset="100%" stopColor="#F08A24" />
            </linearGradient>
          </defs>

          <!-- Outer V (upper hourglass half) -->
          <path
            class="pre-v"
            d="M 6,8 L 32,44 L 58,8"
            fill="none"
            stroke="url(#preGrad)"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <!-- Inverted triangle (lower hourglass half) -->
          <path
            class="pre-tri"
            d="M 10,54 L 32,24 L 54,54 Z"
            fill="none"
            stroke="url(#preGrad)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <!-- Sand / hill shape at base -->
          <path
            class="pre-sand"
            d="M 10,54 Q 21,46 32,49 Q 43,46 54,54 Z"
            fill="url(#preSandGrad)"
          />

          <!-- Dashed flight path -->
          <path
            id="pre-flight-path"
            class="pre-dash"
            d="M 54,10 Q 50,28 32,38"
            fill="none"
            stroke="#27B2C9"
            stroke-width="1.6"
            stroke-dasharray="4 3"
            stroke-linecap="round"
          />

          <!-- Tiny plane icon flying along path -->
          <g class="pre-plane-wrap">
            <path
              d="M-5,0 L3,0 Q6,-1.2 6,0 Q6,1.2 3,0 L-5,0 Z M-5,0 L-7,-2.5 L-7,-1.5 Z M-5,0 L-7,2.5 L-7,1.5 Z"
              fill="#F6A81C"
            />
          </g>
        </svg>

        <div class="pre-wordmark">VAYA</div>
        <div class="pre-tagline">Stand In. Step Out.</div>
      </div>
    </div>

    <!-- ── Main App Root ── -->
    <div id="root"></div>

  </body>
</html>
